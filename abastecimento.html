<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abastecimento com Desconto</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Arial, sans-serif;
    max-width: 420px;
    margin: 20px auto;
    padding: 16px;
    background: #f0f2f5;
  }
  h2 { text-align: center; color: #222; }
  .card {
    background: #fff;
    padding: 16px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    margin-bottom: 16px;
  }
  label { display: block; font-weight: 600; margin: 12px 0 4px; color: #444; }
  input {
    width: 100%;
    padding: 12px;
    font-size: 17px;
    border: 1px solid #ccc;
    border-radius: 8px;
  }
  .resultado {
    background: #e8f5e9;
    border-left: 5px solid #2e7d32;
    padding: 14px;
    border-radius: 8px;
    font-size: 17px;
    line-height: 1.7;
  }
  .resultado strong { color: #2e7d32; font-size: 21px; }
  .dica { font-size: 13px; color: #666; margin-top: 6px; }
</style>
</head>
<body>
  <h2>⛽ Calculadora de Abastecimento</h2>

  <div class="card">
    <label>Preço na bomba (R$/litro)</label>
    <input type="number" id="bomba" step="0.001" placeholder="Ex: 5,00">

    <label>Preço COM desconto (R$/litro)</label>
    <input type="number" id="desc" step="0.001" placeholder="Ex: 4,80">
    <div class="dica">O valor que você realmente paga por litro.</div>

    <label>Quanto você quer PAGAR no final (R$)</label>
    <input type="number" id="alvo" step="0.01" value="30.00">
  </div>

  <div class="resultado" id="saida"></div>

<script>
  const $ = id => document.getElementById(id);

  function calcular() {
    const bomba = parseFloat($('bomba').value);
    const desc  = parseFloat($('desc').value);
    const alvo  = parseFloat($('alvo').value);

    if (!bomba || !desc || !alvo || desc > bomba) {
      $('saida').innerHTML =
        '⚠️ Preencha os três campos. O preço com desconto precisa ser menor ou igual ao da bomba.';
      return;
    }

    const litros      = alvo / desc;       // quanto você vai receber
    const valorBomba  = litros * bomba;    // o que falar pro frentista
    const descontoPct = (1 - desc / bomba) * 100;

    $('saida').innerHTML = `
      Fale pro frentista: <strong>R$ ${valorBomba.toFixed(2)}</strong><br>
      Você recebe: <strong>${litros.toFixed(3)} L</strong><br>
      Paga no final: <strong>R$ ${alvo.toFixed(2)}</strong>
      <div class="dica">Desconto real: ${descontoPct.toFixed(2)}% por litro.</div>
    `;
  }

  ['bomba', 'desc', 'alvo'].forEach(id => $(id).addEventListener('input', calcular));
  calcular();
</script>
</body>
</html>
